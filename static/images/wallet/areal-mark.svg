<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
	<defs>
		<clipPath id="areal-mark-clip">
			<rect width="36" height="36" rx="13"/>
		</clipPath>
		<linearGradient id="areal-mark-purple" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#9000FF" stop-opacity="0.85"/>
			<stop offset="1" stop-color="#11007C" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="areal-mark-glow" cx="10" cy="9" r="22" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#D9BAFF"/>
			<stop offset="1" stop-color="#A56EFF" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<g clip-path="url(#areal-mark-clip)">
		<!-- Base: purple body. Per Figma: Rectangle 39622 #A56EFF. -->
		<rect width="36" height="36" fill="#A56EFF"/>
		<!-- Dark overlay (Rectangle 39623) used as the canvas for the inner blur composite. -->
		<rect width="36" height="36" fill="#080A0F"/>
		<!-- Plus-lighter purple gradient — the dominant 'aurora' inside the mark. -->
		<rect width="36" height="36" fill="url(#areal-mark-purple)" style="mix-blend-mode: plus-lighter"/>
		<!-- Top-left lavender highlight that gives the mark its shine. -->
		<rect width="36" height="36" fill="url(#areal-mark-glow)" style="mix-blend-mode: screen"/>
	</g>
