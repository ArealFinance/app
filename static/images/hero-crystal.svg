<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-hidden="true">
	<title>Areal hero crystal placeholder</title>
	<defs>
		<radialGradient id="glow" cx="35%" cy="35%" r="65%">
			<stop offset="0%" stop-color="#a56eff" stop-opacity="0.95" />
			<stop offset="40%" stop-color="#602fdc" stop-opacity="0.7" />
			<stop offset="80%" stop-color="#230034" stop-opacity="0.6" />
			<stop offset="100%" stop-color="#070c1c" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="halo" cx="50%" cy="50%" r="55%">
			<stop offset="0%" stop-color="#b894ff" stop-opacity="0.5" />
			<stop offset="100%" stop-color="#070c1c" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#fbf2ff" stop-opacity="0.3" />
			<stop offset="55%" stop-color="#a56eff" stop-opacity="0.2" />
			<stop offset="100%" stop-color="#230034" stop-opacity="0.6" />
		</linearGradient>
		<filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="6" />
		</filter>
	</defs>

	<circle cx="300" cy="300" r="270" fill="url(#halo)" filter="url(#blur)" />

	<g filter="url(#blur)">
		<polygon
			points="300,80 460,180 510,330 410,490 220,510 110,400 100,220 200,120"
			fill="url(#glow)"
		/>
		<polygon
			points="300,80 460,180 410,490 220,510 110,400 200,120"
			fill="url(#facet)"
			opacity="0.55"
		/>
		<polygon
			points="300,80 410,490 100,220"
			fill="#fbf2ff"
			opacity="0.06"
		/>
	</g>

	<polygon
		points="300,80 460,180 510,330 410,490 220,510 110,400 100,220 200,120"
		fill="none"
		stroke="#fbf2ff"
		stroke-opacity="0.15"
		stroke-width="1"
	/>
</svg>
