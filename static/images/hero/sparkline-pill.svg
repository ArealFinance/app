<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 100 51"
	fill="none"
	preserveAspectRatio="none"
>
	<title>sparkline curve</title>
	<defs>
		<linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#63FF75" stop-opacity="0.5" />
			<stop offset="100%" stop-color="#63FF75" stop-opacity="0" />
		</linearGradient>
	</defs>
	<!-- Filled area below the curve -->
	<path
		d="M0 40 L8 38 L16 35 L24 38 L32 30 L40 32 L48 22 L56 26 L64 16 L72 12 L80 16 L88 8 L100 14 L100 51 L0 51 Z"
		fill="url(#spark-fill)"
	/>
	<!-- Stroke line — bright green chart curve -->
	<polyline
		points="0,40 8,38 16,35 24,38 32,30 40,32 48,22 56,26 64,16 72,12 80,16 88,8 100,14"
		fill="none"
		stroke="#63FF75"
		stroke-width="2.5"
		stroke-linecap="round"
		stroke-linejoin="round"
		vector-effect="non-scaling-stroke"
	/>
</svg>
