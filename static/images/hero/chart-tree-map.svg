<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
	<title>chart-tree-map</title>
	<!-- Per Figma: duotone #A984F3 — main shape full opacity, small accents at 0.5. -->
	<!-- Top-left big square (full opacity) -->
	<rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="#A984F3" />
	<!-- Top-right small bar (50% opacity) -->
	<rect x="25.5" y="3.5" width="20" height="11" rx="4" fill="#A984F3" fill-opacity="0.5" />
	<!-- Bottom-left small square (50% opacity) -->
	<rect x="2.5" y="26.5" width="19" height="19" rx="4" fill="#A984F3" fill-opacity="0.5" />
</svg>
