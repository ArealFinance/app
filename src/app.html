<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Same favicon as areal.finance: bare crystal, theme-aware. -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/favicon-light.svg?v=3"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/favicon-dark.svg?v=3"
			media="(prefers-color-scheme: dark)"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
